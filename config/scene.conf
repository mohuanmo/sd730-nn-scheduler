# SD730 Smart Scheduler - Scene Integration Config
#
# Scene can control this module by writing to:
#   /data/adb/modules/sd730-scheduler/config/scene_mode
#
# Valid values: auto, powersave, balanced, performance, ultra
#
# Scene Actions:
#   echo "powersave" > /data/adb/modules/sd730-scheduler/config/scene_mode
#   echo "balanced" > /data/adb/modules/sd730-scheduler/config/scene_mode
#   echo "performance" > /data/adb/modules/sd730-scheduler/config/scene_mode
#   echo "ultra" > /data/adb/modules/sd730-scheduler/config/scene_mode
#   echo "auto" > /data/adb/modules/sd730-scheduler/config/scene_mode

scene_enabled=true
scene_mode_file=/data/adb/modules/sd730-scheduler/config/scene_mode
current_mode_file=/data/adb/modules/sd730-scheduler/config/current_mode

# Scene's external-scheduler API has NO "auto" value - once bound, Scene
# always reports one of its 4 modes. The module therefore treats Scene's mode
# as the BASE mode and lets learned per-app modes override it (see
# mode_learning.conf: learned_overrides_scene). Only a genuine CHANGE of
# Scene's value is real intent: it gets scene_hold_seconds of absolute
# priority before a learned per-app mode may take over again.
scene_hold_seconds=12

# SD730 Neural Scheduler v3.0 - Thread-level binding config
# 默认关闭: 开启后热线程候选按"模型分数"重排 (模型缺失时自动回退 v2 规则)
v3_enabled=false

# 模型文件 (train_thread.py 训练产出, awk 可读)
#   model/mlp_v3_enc.txt   场景编码器 (25->10)
#   model/mlp_v3_scr.txt   线程打分器 (10+21->8->1)

# 训练数据: data/collector/YYYYMMDD.traw (collector 每 5 秒采样, 含 6 线程 + 帧率统计)
# 训练命令: python3 train_thread.py   (或 sd730-scheduler --nn-train --v3)

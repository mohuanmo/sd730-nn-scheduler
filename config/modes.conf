# SD730 Smart Scheduler - Mode Configuration
# Snapdragon 730/730G CPU Topology:
#   Big:    cpu6, cpu7  (Kryo 470 Gold, Cortex-A76 @ 2.2GHz)
#   LITTLE: cpu0-cpu5   (Kryo 470 Silver, Cortex-A55 @ 1.8GHz)
# GPU: Adreno 618, hardware ceiling 825MHz (730G) / 700MHz (730)
# Format: mode_name|little_min|little_max|big_min|big_max|gpu_min|gpu_max|boost
#
# This file is read LIVE by the scheduler (every mode application). Edits take
# effect within one cycle (~3s), no reboot required. If an entry is missing or
# contains non-numeric values, the built-in default profile is used instead.
#
# GPU values are SOFT limits: the scheduler compares them against the device
# OPP table (cat /sys/class/kgsl/kgsl-3d0/devfreq/available_frequencies) and
# falls back to the highest real step if the vendor clipped the table.
# Example: a 730G tablet whose table ends at 700MHz will run performance/ultra
# at 700MHz even though 825MHz is requested here. Check your table first:
#   cat /sys/class/kgsl/kgsl-3d0/devfreq/available_frequencies
# Known tables:
#   full SD730G:        180 267 355 430 565 650 700 800 825 (MHz)
#   vendor-clipped 730G: 180 267 355 430 565 650 700     (MHz)
#
# ULTRA GPU HARD-LOCK (v1.5.3, write-first + adaptive floor in v1.5.4): in
# ultra mode, gpu_min >= gpu_max means "pin this exact frequency": the
# scheduler locks devfreq min_freq=max_freq= min(OPP table max, gpu_max),
# switches the GPU governor to `performance`, nails kgsl min/max_pwrlevel to
# 0 (fastest) and sets force_clk/bus/rail_on. A WRITE-FIRST watchdog rewrites
# the whole stack every lock_write_interval (gpu_sched.conf, default 1s)
# even when nothing drifted, then reads back to verify - a thermal clamp is
# corrected by the next write, not discovered by the next read. While no hot
# thread is seen for relax_after_cycles, the floor may breathe down to
# ultra_floor_hz (565MHz default); the ceiling NEVER moves, and one hot
# thread re-locks instantly. With the stock 825|825 entry on a table clipped
# at 700MHz the GPU is hard-locked at 700MHz. To DISABLE the lock, give
# ultra a range instead (e.g. gpu_min=0, gpu_max=825000000).

powersave|300000|1401600|300000|1324800|0|267000000|0
balanced|300000|1804800|300000|2208000|0|565000000|1
performance|300000|1804800|1401600|2208000|267000000|825000000|1
ultra|1401600|1804800|2208000|2208000|825000000|825000000|1

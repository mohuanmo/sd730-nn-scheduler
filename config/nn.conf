# SD730 Neural Scheduler Configuration v2.1
# 白天由 shell/awk 读取，夜间训练由 Python 读取

# 总开关
nn_enabled=true

# 混合比例：0=纯规则，1=纯NN（建议上限 0.5）
nn_alpha=0.0

# 温度安全兜底（°C）：超过此值强制回退纯规则
nn_temp_limit=70

# 模型权重文件路径（awk 可读格式）
nn_model_path=/data/adb/modules/sd730-scheduler/model/mlp_weights.txt

# 推理脚本路径
nn_infer_path=/data/adb/modules/sd730-scheduler/bin/nn_infer.sh

# 采集数据保留天数（自动清理）(v2.1.2: 7 -> 3 天, 由 collector.sh rotate_data 轮询删除)
nn_data_keep_days=5

# ---- 夜间训练配置 ----
# 默认训练窗口（24小时制）
nn_train_start_hour=1
nn_train_end_hour=4

# 用户习惯学习文件（自动记录每天最后活跃时间）
nn_user_habit_path=/data/adb/modules/sd730-scheduler/config/nn_habit.db

# 深度待机检测：屏幕关闭超过此分钟数才认为进入待机
nn_deep_standby_minutes=30

# 训练时最小数据条数
nn_min_train_samples=500

# ---- 训练安全门控 (v2.1.4) ----
# 训练温度上限 (°C): 训练前与训练中(每50epoch巡检)检测, 超限跳过/中止训练
# 非 --force 时还要求"充电+息屏+无前台"(深度待机) 才允许训练
nn_train_max_temp=55

# ---- 前台预热配置 ----
# 刚切前台时的 k 值 boost（持续秒数）
nn_warmup_seconds=3
nn_warmup_k_boost=0.3

# ---- 弹性预算配置 ----
# NN 输出的 cap_ratio 映射范围
cap_ratio_min=0.5
cap_ratio_max=1.5

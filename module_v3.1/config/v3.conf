# SD730 Neural Scheduler v3.2 - Neural Network (thread-level) config
# v3.2: 已移除 V2 场景级模型, 本模块只使用神经网络(线程级)模型。
# 开启后热线程候选按"模型分数"重排 (模型缺失时自动回退规则调度)。
# 默认开启 (v3.2): 装好模块即可用, 模型训练后自动生效。
v3_enabled=true

# 自动训练开关: true=训练窗口内自动训练神经网络模型 (默认开启)
# 自动训练仍要求样本>=300 (由 train_thread.py 把关);
# 引擎自动选择: 有 numpy 用 train_thread.py(快), 无 numpy 用 train_thread_pure.py(纯Python, 慢一些)
# 训练成功当天不重复, 失败窗口内自动重试。
v3_auto_train=true

# 模型文件 (train_thread*.py 训练产出, awk 可读)
#   model/mlp_v3_enc.txt   场景编码器 (33->10)
#   model/mlp_v3_scr.txt   线程打分器 (10+21->8->1)

# 训练数据: data/collector/YYYYMMDD.traw (collector 每 5 秒采样, 含 6 线程 + 帧率统计)
# 训练命令: sd730-scheduler --nn-train-now   (或 sh bin/train.sh [--force])

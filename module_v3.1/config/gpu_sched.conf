# SD730 Smart Scheduler - GPU Adaptive Scheduler Configuration (v1.5.4)
#
# Two cooperating mechanisms, both read LIVE (no reboot):
#   A. Ultra adaptive hard-lock: write-first re-assert of the GPU lock stack
#      every lock_write_interval, with a bounded breathing band whose FLOOR
#      may drop while the CEILING never moves. Relaxing is gated by the
#      Thread Pin Engine's live hot-thread data (important scenes stay
#      locked).
#   B. Per-app GPU tiers (non-ultra modes): the learned app profile
#      (learning.db's gpu%) picks a heavy/mid/light band for the foreground
#      app, intersected with the active mode's range. Sample-starved apps
#      follow the plain mode range. The watchdog re-asserts the band on
#      drift every second.

# Master switch. false = fall back to the v1.5.3 behavior (verify-only
# watchdog in ultra, mode-range-only limits elsewhere).
gpu_sched_enabled=true

# --- A. Ultra adaptive hard-lock ---

# Watchdog write interval in SECONDS (toybox sleep accepts fractions, e.g.
# 0.5). Write-first: the whole lock stack is rewritten every interval even
# when nothing drifted, so a thermal clamp survives at most one interval.
lock_write_interval=1

# Ultra relax floor in Hz. When relaxing is allowed, devfreq min_freq drops
# to this value (OPP-snapped) while max_freq stays pinned at the table top:
# the GPU may wander inside [ultra_floor_hz, table max] but NEVER below the
# floor. Default 565MHz ("500-something"); set >= the table max to disable
# relaxing entirely.
ultra_floor_hz=565000000

# Important-scene detection: a foreground-app thread at/above this % of one
# core (Thread Pin Engine sampling) means an important scene -> instant
# re-lock on the next watchdog cycle. Aligned with thread_pin.conf's
# hot_threshold by default.
important_thread_cpu=25

# Hysteresis: this many consecutive watchdog cycles WITHOUT a hot thread are
# required before the floor may drop. One hot sample re-locks immediately.
# (Effective cycles: heavy-profile apps need 2x, light-profile apps 0.5x.)
relax_after_cycles=5

# --- B. Per-app GPU tiers (non-ultra modes) ---

# Minimum learning samples before an app's tier is trusted; below this the
# app simply follows the active mode's GPU range.
profile_min_samples=5

# Tier classification by learned GPU affinity (gpu% in learning.db):
#   gpu% >= heavy_gpu_pct -> heavy, >= mid_gpu_pct -> mid, else light.
heavy_gpu_pct=70
mid_gpu_pct=40

# Per-tier bands in Hz. *_max_hz=0 means "no tier limit" (the mode/table
# ceiling applies). Bands are intersected with the active mode's range, so
# they can only NARROW the mode, never exceed it. heavy_min_hz keeps a
# GPU-bound app's floor high enough that the governor stops diving between
# frames; light apps get a lowered ceiling instead (they never needed more).
heavy_min_hz=430000000
heavy_max_hz=0
mid_min_hz=267000000
mid_max_hz=650000000
light_min_hz=0
light_max_hz=565000000
